name: Deliver Daily Digest

on:
  schedule:
    # 8am CST (China Standard Time) = midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  deliver:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: cd scripts && npm install

      - name: Create delivery config
        run: |
          mkdir -p ~/.follow-builders
          cat > ~/.follow-builders/config.json << 'EOF'
          {
            "platform": "other",
            "language": "bilingual",
            "timezone": "Asia/Shanghai",
            "frequency": "daily",
            "deliveryTime": "08:00",
            "delivery": {
              "method": "discord",
              "webhookUrl": "https://discord.com/api/webhooks/1503608674067808397/roL1NXVquWfGogEUuFAJboxt2TRLQSkwmZwMD57T_qYyAPLeZrv24Er_SURzlVz2Dy7U"
            },
            "onboardingComplete": true
          }
          EOF

      - name: Generate, save, and deliver digest
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          cd scripts
          node prepare-digest.js | node remix.js > ../latest-digest.md
          cat ../latest-digest.md | node deliver.js

      - name: Commit digest to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest-digest.md
          git diff --cached --quiet || git commit -m "digest: $(date +%Y-%m-%d) [skip ci]"
          git push
