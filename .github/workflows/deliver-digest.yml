name: Deliver Daily Digest

on:
  schedule:
    # 8am CST (China Standard Time) = midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: cd scripts && npm install

      - name: Create delivery config
        run: |
          mkdir -p ~/.follow-builders
          cat > ~/.follow-builders/config.json << 'EOF'
          {
            "platform": "other",
            "language": "bilingual",
            "timezone": "Asia/Shanghai",
            "frequency": "daily",
            "deliveryTime": "08:00",
            "delivery": {
              "method": "telegram",
              "chatId": "2085540482"
            },
            "onboardingComplete": true
          }
          EOF

      - name: Generate and deliver digest
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          cd scripts
          node prepare-digest.js | node remix.js | node deliver.js
